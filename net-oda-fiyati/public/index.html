<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Net Oda Fiyatı</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* PDF / yazdırma: yalnızca sade rapor basılır (A4 yatay) */
    @page { size: A4 landscape; margin: 12mm; }
    .rapor { display: none; }
    @media print {
      body { background: #fff; color: #000; }
      .ust, .icerik { display: none !important; }
      .rapor { display: block; font-size: 11px; }
      .rapor-baslik { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; margin-bottom: 10px; }
      .rapor-baslik h1 { font-size: 18px; margin: 0 0 4px; }
      .rapor-baslik p { margin: 0 0 8px; color: #333; }
      .rapor-tarih { color: #333; }
      .rapor-tablo { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .rapor-tablo th, .rapor-tablo td { border: 1px solid #999; padding: 4px 6px; text-align: right; }
      .rapor-tablo th { background: #eee; font-size: 10px; }
      .rapor-tablo .sol { text-align: left; }
      .rapor-tablo td.net { font-weight: 700; background: #eef7f0; }
      .rapor-tablo td.afis { font-weight: 700; background: #fff4d6; }
      .rapor-tablo tr { break-inside: avoid; }
      .rapor-not { margin-top: 8px; color: #333; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="ust">
    <div class="ust-satir">
      <div class="marka">
        <strong id="baslik">Net Oda Fiyatları</strong>
        <span class="alt-baslik">Satış fiyatı → Erken Rezervasyon → Komisyon → Net</span>
      </div>
      <div class="araclar">
        <span id="kayit-durumu" class="kayit-durumu" aria-live="polite"></span>
        <button type="button" data-islem="csv">Excel'e aktar (CSV)</button>
        <button type="button" class="birincil" data-islem="pdf">PDF olarak al</button>
      </div>
    </div>
    <div class="kpi-serit" id="kpi-serit"></div>
  </header>
  <main id="icerik" class="icerik"></main>
  <section id="rapor" class="rapor" aria-hidden="true"></section>
  <script type="module" src="app.js"></script>
</body>
</html>
